server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types has no mapping for .mjs, so ES-module assets
    # (notably the pdf.js web worker used for PDF domain-file extraction,
    # REQ-US-FC-10) would be served as application/octet-stream and rejected
    # by the browser's strict MIME check for module scripts. Serve them as
    # JavaScript so the worker loads.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
